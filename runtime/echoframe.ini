# EchoFramePCVR runtime settings (read when Echo starts)

# Eye texture size, as a multiple of what the headset recommends (0.25 to 2.0).
# Lower it on the Steam Frame if Echo can't hold the headset's refresh rate.
RenderScale = 1.0

# 1 = start from hmd_cache.txt (saved on the first launch) instead of opening a
# temporary OpenXR session to measure the headset's field of view.
HmdCache = 1

# 1 = time each frame on the GPU (D3D12 timestamp queries on Echo's queue) and log
# a GPU/CPU breakdown to runtime.log every 10 s. 0 = CPU timing only.
FrameTiming = 1

# Foveated rendering: the edges of each eye's image are shaded at a lower rate (2x2 or 4x4
# pixel blocks), where the lens shows less detail anyway. 0 = off, 1 = light, 2 = medium,
# 3 = strong. Needs variable-rate shading (the Steam Frame's GPU has it).
Foveation = 2

# With Foveation on and the Steam Frame's eye tracking (XR_EXT_eye_gaze_interaction), the
# full-rate region follows the gaze; 0 = always centred on the lens.
GazeFoveation = 1

# The settings below can be changed while Echo runs (the file is reread when it changes).

# 1 = log, per throw, the controller's reported velocity against its tracked motion.
VelocityLog = 0

# 1 = every 20 s, time each render pass on the GPU and log the most expensive, by shader hash.
PassTiming = 0

# Draws and dispatches with these shader hashes (as the PassTiming lines name them) are skipped.
#Skip = 0fa415e46e79e813,698cec977b8e02a9

# Echo's own code and globals (echovr.exe build 631547; see docs/FRAME-NOTES.md).
# Patch = rva:old:new (hex, applied once at load where the old bytes match), e.g. Echo's
# mobile feature strip:
#Patch = 5863F7:7434:9090
# Poke = rva:type:value (f float, i int, b byte; written after every frame), e.g. particle and
# light quality masks off and mesh LOD distance x50 (frame.py profile 90 sets these):
#Poke = 20AFB84:i:0,20AFB80:i:0,20AFBC8:f:50.0,20AFBD0:f:50.0,20AFBD4:f:100.0
# Peek = rva:bytes logs that memory once.
